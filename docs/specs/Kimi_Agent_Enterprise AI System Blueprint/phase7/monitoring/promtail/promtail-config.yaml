# =============================================================================
# Promtail Configuration for Log Collection
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ========================================================================
  # System Logs
  # ========================================================================
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log

  # ========================================================================
  # Docker Container Logs
  # ========================================================================
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|])*[^|])
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # ========================================================================
  # Ollama Logs
  # ========================================================================
  - job_name: ollama
    static_configs:
      - targets:
          - localhost
        labels:
          job: ollama
          service: llm
          __path__: /var/lib/docker/containers/ollama*/*.log
    pipeline_stages:
      - json:
          expressions:
            message: log
            level:
            timestamp: time
      - labels:
          level:
      - timestamp:
          format: RFC3339Nano
          source: timestamp
      - output:
          source: message

  # ========================================================================
  # RAG Service Logs
  # ========================================================================
  - job_name: rag-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: rag-service
          service: rag
          __path__: /var/lib/docker/containers/*rag-service*/*.log
    pipeline_stages:
      - json:
          expressions:
            message: log
            level:
            timestamp: time
            trace_id:
      - labels:
          level:
          trace_id:
      - timestamp:
          format: RFC3339Nano
          source: timestamp
      - output:
          source: message

  # ========================================================================
  # API Gateway Logs
  # ========================================================================
  - job_name: api-gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-gateway
          service: api
          __path__: /var/lib/docker/containers/*api-gateway*/*.log
    pipeline_stages:
      - json:
          expressions:
            message: log
            level:
            timestamp: time
            request_id:
            user_id:
      - labels:
          level:
          request_id:
          user_id:
      - timestamp:
          format: RFC3339Nano
          source: timestamp
      - output:
          source: message

  # ========================================================================
  # MCP Server Logs
  # ========================================================================
  - job_name: mcp-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: mcp-server
          service: mcp
          __path__: /var/lib/docker/containers/*mcp-server*/*.log
    pipeline_stages:
      - json:
          expressions:
            message: log
            level:
            timestamp: time
            tool_name:
      - labels:
          level:
          tool_name:
      - timestamp:
          format: RFC3339Nano
          source: timestamp
      - output:
          source: message

  # ========================================================================
  # ChromaDB Logs
  # ========================================================================
  - job_name: chromadb
    static_configs:
      - targets:
          - localhost
        labels:
          job: chromadb
          service: database
          __path__: /var/lib/docker/containers/*chromadb*/*.log
    pipeline_stages:
      - json:
          expressions:
            message: log
            level:
            timestamp: time
      - labels:
          level:
      - timestamp:
          format: RFC3339Nano
          source: timestamp
      - output:
          source: message
