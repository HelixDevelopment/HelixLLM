# Real-infra compose for TestRAGRerankPipeline_LiveEndToEnd
# (tests/integration/rag_rerank_pipeline_live_test.go).
#
# Booted THROUGH the containers submodule compose.Orchestrator (§11.4.76),
# rootless podman (§11.4.161). CPU-only (§11.4.119 — the video-analysis
# stream owns the GPU and is never touched here). The live coder (:18434,
# read-only, never restarted per §11.4.122) is untouched by this file.
#
# Reuses the SAME proven service shapes as
# docs/qa/phase3_rag_qdrant_rerank_20260711T142237Z/harness/compose.qdrant_rerank.yml
# (§11.4.74 reuse-before-reimplement) on a DISTINCT port range so this run
# never collides with that harness or any concurrent track.
#
# No hardcoded model/host-port/limit literal beyond this file's own env-var
# placeholders (§CONST-045/046) — every value is injected by the Go test
# before boot; ${VAR} are always set by the test.
services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    mem_limit: "${QDRANT_MEM_LIMIT}"
    cpus: ${QDRANT_CPUS}
    restart: "no"
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - "--model-id"
      - "${TEI_EMBED_MODEL_ID}"
      - "--port"
      - "80"
      - "--hostname"
      - "0.0.0.0"
    ports:
      - "${TEI_EMBED_HOST_PORT}:80"
    volumes:
      - helixllm-tei-cache:/data
    mem_limit: "${TEI_EMBED_MEM_LIMIT}"
    cpus: ${TEI_EMBED_CPUS}
    restart: "no"
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - "--model-id"
      - "${TEI_RERANK_MODEL_ID}"
      - "--port"
      - "80"
      - "--hostname"
      - "0.0.0.0"
    ports:
      - "${TEI_RERANK_HOST_PORT}:80"
    volumes:
      - helixllm-tei-rerank-cache:/data
    mem_limit: "${TEI_RERANK_MEM_LIMIT}"
    cpus: ${TEI_RERANK_CPUS}
    restart: "no"
volumes:
  helixllm-tei-cache:
    external: true
    name: helixllm-tei-cache
  helixllm-tei-rerank-cache:
    external: true
    name: helixllm-tei-rerank-cache
