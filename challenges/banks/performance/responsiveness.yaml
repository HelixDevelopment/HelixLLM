#
# Challenge Bank: Responsiveness
# Validates response time SLOs for all endpoint types.

name: responsiveness
version: 1.0.0
description: |
  Responsiveness challenge suite for HelixLLM. Validates that health and
  metadata endpoints meet their response-time service-level objectives
  under normal operating conditions.

platforms:
  - linux

timeout: 5m

steps:
  # CH-PERF-RESP-001: Health endpoint must respond in under 100ms
  - name: health_sub_100ms
    type: benchmark
    params:
      iterations: 50
      warmup: 5
      request:
        method: GET
        path: /internal/health
    assertions:
      - type: status
        expected: 200
      - type: latency_p95_lte
        field: response_time_ms
        expected: 100
    on_failure: |
      Health endpoint exceeded 100ms P95 response time SLO.

  # CH-PERF-RESP-002: Models listing must respond in under 200ms
  - name: models_sub_200ms
    type: benchmark
    params:
      iterations: 50
      warmup: 5
      request:
        method: GET
        path: /v1/models
    assertions:
      - type: status
        expected: 200
      - type: latency_p95_lte
        field: response_time_ms
        expected: 200
    on_failure: |
      Models listing endpoint exceeded 200ms P95 response time SLO.
