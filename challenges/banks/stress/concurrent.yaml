name: Concurrent Request Stress
description: Validates system stability under parallel request floods
category: stress
priority: high

challenges:
  - name: 100_concurrent_completions
    description: 100 parallel chat completions
    steps:
      - method: POST
        path: /v1/chat/completions
        concurrent: 100
        body:
          model: "auto"
          messages:
            - role: user
              content: "Respond with OK"
        assertions:
          - type: status_one_of
            values: [200, 429, 503]
          - type: no_5xx_except
            values: [503]

  - name: 500_concurrent_model_list
    description: 500 parallel model listing requests
    steps:
      # Two different claims live in this step and they are not treated alike.
      #
      # The INVARIANT is a property of the CODE: under 500 simultaneous
      # requests every one is answered 200. It is asserted on every attempt
      # and is never skipped or retried away.
      #
      # The BUDGET used to be `response_time_ms: max 1000` — a fixed
      # wall-clock ceiling, which on a shared host measures the host. Measured
      # three times against two binaries, one carrying a fix this endpoint's
      # code path never touches:
      #   run1 OLD FAIL 1742.7ms   run1 NEW FAIL 1037.3ms
      #   run2 OLD pass            run2 NEW FAIL 1135.9ms
      #   run3 OLD FAIL 1016.7ms   run3 NEW pass
      # It flipped green/red run to run on BOTH binaries — a coin flip that
      # cost an investigation every time it landed red. Raising the ceiling
      # until today's run passes is not a fix: it re-arms on the next slower
      # host, and a ceiling generous enough to survive a loaded machine is too
      # generous to catch anything.
      #
      # It is now RELATIVE: p99 under concurrency against what the same 500
      # would cost served one at a time at this host's own uncontended median,
      # measured moments earlier by the `baseline:` block. A host that halves
      # the concurrent throughput halves the baseline too, so the ratio holds
      # still while the wall clock moves. Calibrated on this project's own
      # fixtures, not from literature: 7 measured runs against the dev server
      # under real agent load gave 0.15x-3.46x, so 12 leaves ~3.5x headroom
      # over the worst observed. At 12, twelve consecutive runs gave 10 passed
      # / 2 honestly skipped / 0 failed.
      #
      # The PRECONDITION is a property of the HOST alone: the uncontended
      # series must be steady enough to divide by. `max_spread: 8` is the
      # limit on slowest/median of that series; beyond it the step SKIPS,
      # quoting the measured numbers, because a ratio built on that much noise
      # is neither a pass nor a defect. Per the retry discipline in
      # internal/lifecycle/evict_test.go a missed window is retried with the
      # invariant re-checked on every attempt before the skip is reported.
      - method: GET
        path: /v1/models
        concurrent: 500
        baseline:
          samples: 12
          max_spread: 8
        retry:
          max_attempts: 3
          interval_ms: 500
        assertions:
          - type: status
            value: 200
          - type: concurrent_latency_ratio
            max: 12
