            {
              "role": "user",
              "content": "Fix the nil pointer dereference in this Go code:\nfunc getUserName(u *User) string {\n    return u.Name\n}\nExplain what guard you added and why."
            }
          ]
        }
    assertions:
      - type: http_status_ok
      - type: not_empty
        field: body.choices[0].message.content
    on_failure: |
      Model did not return a response for the nil pointer fix task.

