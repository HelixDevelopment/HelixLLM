# Challenge Bank: Developer Coding Workflows
# Real-world developer coding tasks sent to HelixLLM as chat completions.

name: developer-coding-workflows
version: 1.0.0
description: |
  Validates that HelixLLM can handle real-world developer coding tasks.
  Each step submits a representative coding prompt and asserts that the
  model returns a non-empty assistant response.

platforms:
  - linux

timeout: 10m

steps:
  # CH-WF-COD-001: Parse CSV
  - name: write-csv-parser
    type: http_request
    params:
      method: POST
      path: /v1/chat/completions
      headers:
        Content-Type: application/json
      body: |
        {
          "model": "llama-3.1-70b",
          "messages": [
            {
              "role": "user",
              "content": "Write a Go function that parses a CSV string into a slice of string slices. Handle quoted fields and escaped commas."
            }
          ]
        }
    assertions:
      - type: http_status_ok
      - type: not_empty
        field: body.choices
      - type: contains
        field: body.choices[0].message.role
        expected: "assistant"
      - type: not_empty
        field: body.choices[0].message.content
    on_failure: |
      Model did not return a response for the CSV parser coding task.

  # CH-WF-COD-002: REST API endpoint
  - name: implement-rest-endpoint
    type: http_request
    params:
      method: POST
      path: /v1/chat/completions
      headers:
        Content-Type: application/json
      body: |
        {
          "model": "llama-3.1-70b",
          "messages": [
            {
              "role": "user",
              "content": "Implement a REST API endpoint in Go using the net/http package that accepts a POST request to /users, validates the JSON body (name and email required), and returns 201 on success or 400 on validation failure."
            }
          ]
        }
    assertions:
      - type: http_status_ok
      - type: not_empty
        field: body.choices[0].message.content
    on_failure: |
      Model did not return a response for the REST endpoint task.

