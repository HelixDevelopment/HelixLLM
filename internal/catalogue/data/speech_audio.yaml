# Speech & audio catalogue entries — speech-to-text, text-to-speech,
# audio-classification, audio-generation.
#
# SOURCE OF TRUTH for every figure, licence and viability claim below:
#   specs/002-adaptive-local-model-serving/research/03-speech-audio.md
#   (research pass dated 2026-09-02; its own "Sources" section carries the
#   per-claim citations).
# Wire shape: internal/catalogue/load.go (strict — KnownFields(true); an
#   unrecorded key refuses the WHOLE file, so `annotations` is the only place
#   free-form material may go and `notes` is the only place provenance goes).
# Field semantics: specs/002-adaptive-local-model-serving/data-model.md
#   § "Model Option".
#
# ---------------------------------------------------------------------------
# THREE RULES THIS FILE ENCODES, each of which the research made load-bearing
# ---------------------------------------------------------------------------
#
# 1. LICENSING, NOT VRAM, IS THE BINDING CONSTRAINT HERE (research §B.2, §C.2).
#    Several of the strongest models cannot be used commercially at all. Every
#    entry states `usage_terms.permitted` and, where a term excludes a purpose,
#    names that term so a caller can WITHHOLD the entry from a declared
#    commercial use and cite the restricting clause rather than reporting a
#    generic unavailability (FR-054/FR-055, D4/D6). Where the research did NOT
#    re-confirm the licence text itself, that is recorded in `notes` as
#    "LICENCE NOT RE-VERIFIED" — such an entry grants research/evaluation ONLY
#    and must not be offered for commercial use until the licence is read at
#    acquisition time. (The previous shape of this file carried that as a
#    `license_verified` flag inside `usage_terms`; the wire format has no such
#    field, and a flag beside the grant is easy to read past. In `notes` it is
#    unmissable, and the grant itself already omits `commercial`.)
#
# 2. THE FOUR SUB-FAMILIES SPLIT SHARPLY ON ACCELERATOR NEED, so they are FOUR
#    families here, not two (research §C.4). audio-classification is
#    processor-viable on every host tier; audio-generation has NO
#    processor-viable option at any RAM size surveyed. Lumping them into one
#    "audio" family would force a choice between violating FR-003 (a no-GPU
#    host MUST receive real options, never an empty set) for that family and
#    quietly never surfacing generation at all. The per-family statement a
#    no-accelerator host is owed INSTEAD of an offer is preserved verbatim in
#    the FAMILY STATEMENTS block below — the wire format permits only `entries`
#    and `streaming_roster` at the top level, so it cannot be data here.
#    (The `audio-classification` family constant this file needs now EXISTS in
#    internal/catalogue/entry.go, alongside `audio-generation`; the two are
#    deliberately separate for exactly the reason above.)
#
# 3. UNVERIFIED FIGURES ARE CARRIED FORWARD AS UNVERIFIED, NEVER RESOLVED INTO
#    A CONFIDENT NUMBER (§11.4.6). An ABSENT measurement is not a small number.
#    This wire format has no way to say "absent": `memory_required_bytes` and
#    `storage_required_bytes` are unsigned integers and zero is refused by
#    Entry.Validate. A model whose required figure the research did not source
#    therefore CANNOT BE AN ENTRY — and is not deleted either. It is moved
#    verbatim, with every figure, source phrasing and UNVERIFIED note intact,
#    to the DEFERRED block at the end of this file, with the measurement it
#    needs named. The gap stays visible and closeable rather than papered over.
#
# ---------------------------------------------------------------------------
# ONLY THREE OF THE 26 RESEARCHED MODELS LOAD — and the reason is one axis
# ---------------------------------------------------------------------------
# The research pass sourced a runtime MEMORY figure for 18 of the 26 models,
# but an ON-DISK WEIGHT SIZE for only three: whisper-medium ("~1.5 GB on disk
# (GGML)"), parakeet-tdt-0.6b-v3 int8 ("~670 MB on disk (CPU int8 build)") and
# xtts-v2 ("1.88 GB weights at fp32"). Every other model's `storage_required`
# reads "not sourced" or "not sourced separately from the memory figure".
#
# Storage is checked against free disk SEPARATELY and is NEVER derived from the
# memory figure (D2) — the streaming path exists precisely for weights whose
# on-disk size dwarfs memory. So a missing disk figure cannot be filled in from
# the memory figure that IS present, and 23 models are deferred on that single
# axis. Eight of them are additionally missing the memory figure too.
#
# This is the cheapest gap in the catalogue to close: for most of these models
# the weight file is a published artefact whose size is one HTTP HEAD away.
#
# ---------------------------------------------------------------------------
# STREAMING
# ---------------------------------------------------------------------------
# No entry in this file states a `streaming_family`, without exception: the
# disk-streaming runtime serves a closed, named roster of text mixture-of-expert
# families and names no speech or audio family (D1 — eligibility is roster
# membership, never an architecture predicate). This file therefore declares no
# `streaming_roster` either; stating no family is the accurate record, and an
# entry that named one would have to be on the roster to load at all.
#
# ---------------------------------------------------------------------------
# INTEGRITY
# ---------------------------------------------------------------------------
# No digest appears anywhere in this file. The research gathered none, and
# fabricating one would defeat the check it exists to perform (SC-011). Each
# entry names the algorithm to use; the digest and size are captured from the
# published weight file when it is acquired. An entry in this state LOADS and
# may be OFFERED — Entry.Validate does not require an integrity expectation —
# and is refused by Entry.ValidateForAcquisition, the gate that precedes
# touching a weight file. The `status: pending-acquisition` marker each entry
# carried is preserved in `notes`.
#
# ---------------------------------------------------------------------------
# SOURCE
# ---------------------------------------------------------------------------
# This research pass recorded no weight-source URL for any model in this file,
# so no entry states a `source`. That is the ordinary researched-but-unlocated
# state: Entry.Validate does not require a source, and
# Entry.ValidateForAcquisition does — which is the correct gate, since `source`
# is what the acquisition allowlist is checked against (FR-012/SC-011).
#
# `annotations` is free-form and, per load.go, "never read for a decision" — it
# carries provenance only. Nothing in it, and nothing in `notes`, is user-facing
# text: per CONST-046 what a user sees is composed at the presentation boundary
# from `descriptor` facts plus host measurement, in the user's language.
#
# ---------------------------------------------------------------------------
# FAMILY STATEMENTS + RESEARCH SOURCE — preserved verbatim from the previous
# shape of this file. The wire format permits only `entries` and
# `streaming_roster` at the top level, so these cannot be data here; nothing
# in them was read for a decision, and every word is kept.
#
# What a no-accelerator host is owed INSTEAD of an offer is the
# `no_accelerator_gap` / `no_accelerator_reason` text below — it is the
# stated limit of the offer, not a withheld option.
# ---------------------------------------------------------------------------
#
# source:
#   research: specs/002-adaptive-local-model-serving/research/03-speech-audio.md
#   research_date: "2026-09-02"
#   data_model: specs/002-adaptive-local-model-serving/data-model.md
#
# families:
#
#   speech-to-text:
#     processor_viable: true
#     statement: >-
#       Small Whisper variants and Parakeet int8 serve acceptably on a host with
#       no accelerator. Whisper small (99 languages, ~6-8x real-time on a modern
#       CPU) is the no-GPU pick; Parakeet int8 fits the same tier but is
#       batch-oriented (RTF 0.3-0.5) and covers 25 European languages only.
#     no_accelerator_gap: >-
#       Full 99-language REAL-TIME INTERACTIVE transcription on a processor-only
#       host does not exist at any RAM tier surveyed. Anything larger than
#       Whisper small or Parakeet 0.6B drops below real-time on CPU and is
#       batch-only. This is a stated limit of the offer, not a withheld option.
#     existing_implementation: >-
#       Not greenfield. container/whisper_stt_server.py (faster-whisper,
#       device=cpu, compute_type=int8, OpenAI-compatible
#       POST /v1/audio/transcriptions, VAD + no_speech_prob hallucination
#       guards) plus container/Containerfile.whisper already serve this family's
#       Whisper entries on the processor path; WHISPER_MODEL / WHISPER_DEVICE /
#       WHISPER_COMPUTE_TYPE select the entry at runtime. What does not exist is
#       the hardware-aware selection, naming and discovery integration — that is
#       unbuilt for this family exactly as it is for the other three.
#
#   text-to-speech:
#     processor_viable: true
#     statement: >-
#       Kokoro-82M (Apache-2.0) and Piper (GPL-3.0) serve on a host with no
#       accelerator. Kokoro is the commercial-safe processor default; Piper is
#       the lighter-weight fallback where a Raspberry-Pi-class footprint matters
#       more than avoiding copyleft.
#     no_accelerator_gap: >-
#       Commercially-licensed, high-fidelity VOICE CLONING is unavailable on a
#       processor-only host at any RAM tier surveyed. Every cloning-capable model
#       (Chatterbox, XTTS-v2, F5-TTS, Fish Speech, CosyVoice2, OpenVoice V2) is
#       GPU-oriented and no CPU real-time factor was sourced for any of them. A
#       no-accelerator host gets fast, natural, NON-cloning speech — and this
#       sentence, rather than a cloning offer it cannot run.
#
#   audio-classification:
#     processor_viable: true
#     statement: >-
#       Mature, cheap and processor-viable on EVERY host class including the
#       smallest (no accelerator, 8 GB RAM). This family is deliberately not
#       gated behind an accelerator tier; every entry sets
#       requires_accelerator false.
#     no_accelerator_gap: none
#
#   audio-generation:
#     processor_viable: false
#     statement: >-
#       Every entry sets requires_accelerator true. There is NO mature,
#       processor-viable, low-VRAM open-weight option for music or sound-effect
#       generation. The cheapest candidate surveyed (ACE-Step 2B) still needs
#       roughly 4 GB of accelerator memory, and more host RAM does not substitute
#       for an accelerator here.
#     no_accelerator_reason: >-
#       A host with no accelerator MUST be given this reason — "no candidate
#       surveyed runs acceptably on a processor at any RAM size" — and never an
#       offer from this family (FR-028). The withheld reason is
#       unsupported_configuration, not insufficient_resources: adding RAM does
#       not make these entries servable.
#
#
entries:

  # ---------------------------------------------------------------- speech-to-text

  - model_id: whisper-medium
    family: speech-to-text
    descriptor:
      parameter_count: 769000000
      specialisations: [transcription, multilingual]
    memory_required_bytes: 5368709120
    storage_required_bytes: 1610612736
    requires_accelerator: false
    usage_terms:
      license_id: MIT
      permitted: [commercial, personal, research, evaluation]
    runtime: in-memory
    expected_capability:
      modalities: [audio]
    notes:
      - "Memory: '~5 GB VRAM; ~2.1 GB RAM at runtime under int8/ggml'. The 5 GB figure is the conservative accelerator requirement and is what is recorded. The int8 processor path needs materially less (~2.1 GB) — the two paths differ and the lower figure applies ONLY to the quantised build, so it is not the admission figure for this entry."
      - "Storage: '~1.5 GB on disk (GGML)'. One of only three on-disk figures the research sourced in this family — checked against free disk in its own right, never derived from the memory figure (D2)."
      - "Processor-viable but SLOWER THAN REAL-TIME on mid-range processors — batch use only without an accelerator. `requires_accelerator: false` records that it runs, not that it is interactive."
      - "Licence re-verified in the research pass: MIT, commercial use safe."
      - "PENDING-ACQUISITION: no weight digest and no weight-file size recorded; ValidateForAcquisition refuses this entry until both are captured (SC-011)."
    annotations:
      summary: >-
        769M-parameter Whisper, 99 languages. Accelerator-comfortable; on a
        processor it runs slower than real-time on mid-range hardware, so it
        serves batch work rather than interactive transcription.
      languages: 99
      memory_basis: sourced
      memory_sourced: "~5 GB VRAM; ~2.1 GB RAM at runtime under int8/ggml"
      storage_basis: sourced
      storage_sourced: "~1.5 GB on disk (GGML)"
      accelerator_note: >-
        Processor-viable but slower than real-time on mid-range CPUs — batch use
        only without an accelerator.
      throughput_note: "Below real-time on CPU; batch + wrapper streaming."
      streaming_note: "Speech families are absent from the streaming runtime's roster."
      integrity_status: pending-acquisition
      catalogue_status: verified

  - model_id: parakeet-tdt-0.6b-v3
    variant: int8
    family: speech-to-text
    descriptor:
      parameter_count: 627000000
      quantisation: int8
      specialisations: [transcription, batch]
    memory_required_bytes: 2147483648
    storage_required_bytes: 702545920
    requires_accelerator: false
    usage_terms:
      license_id: CC-BY-4.0
      permitted: [commercial, personal, research, evaluation]
      restrictions:
        - term: attribution-required
          reference: "CC-BY-4.0 attribution clause"
    notes:
      - "The `attribution-required` restriction is NON-EXCLUSIONARY and states no `excludes`: it constrains how output is used, excludes no purpose, and therefore must NEVER be reported as a reason this entry was withheld."
      - "Memory: '~2 GB RAM under CPU int8'. Storage: '~670 MB on disk (CPU int8 build)' — one of only three on-disk figures the research sourced in this family."
      - "Processor-viable, batch-oriented: real-time factor ~0.3-0.5 on a recent x86 processor with int8 quantisation and 4-thread inference (2-3x real-time) — usable for offline batch, NOT for real-time interactive use."
      - "Covers 25 European languages, NOT Whisper's 99. Preferred over Whisper small on a no-accelerator host only when the workload is English/European batch transcription."
      - "Licence re-verified in the research pass: CC-BY-4.0, commercial use safe with attribution."
      - "A sherpa-onnx streaming int8 build exists but is a separate two-model pattern (research §A.2), not this entry."
      - "PENDING-ACQUISITION: no weight digest and no weight-file size recorded."
    runtime: in-memory
    expected_capability:
      modalities: [audio]
    annotations:
      summary: >-
        NVIDIA Parakeet TDT, 627M parameters, quantised to int8 for processor
        inference. Covers 25 European languages — not Whisper's 99 — and is
        batch-oriented.
      languages: 25
      memory_basis: sourced
      memory_sourced: "~2 GB RAM under CPU int8"
      storage_basis: sourced
      storage_sourced: "~670 MB on disk (CPU int8 build)"
      accelerator_note: >-
        Processor-viable, batch-oriented: real-time factor ~0.3-0.5 on a recent
        x86 CPU with int8 quantisation and 4-thread inference (2-3x real-time).
      streaming_note: "Speech families are absent from the streaming runtime's roster."
      integrity_status: pending-acquisition
      catalogue_status: verified

  # ---------------------------------------------------------------- text-to-speech

  - model_id: xtts-v2
    family: text-to-speech
    descriptor:
      quantisation: fp32
      specialisations: [voice-cloning, multilingual]
    memory_required_bytes: 6442450944
    storage_required_bytes: 2018634138
    requires_accelerator: true
    usage_terms:
      license_id: CPML
      permitted: [research, evaluation, personal]
      restrictions:
        - term: non-commercial
          excludes: [commercial]
          reference: "Coqui Public Model License (CPML)"
    runtime: in-memory
    expected_capability:
      modalities: [text, audio]
    notes:
      - "NON-COMMERCIAL IN PRACTICE, and unusually so: CPML contemplates a commercial licence, but Coqui Inc shut down in January 2024, so there is no longer anyone who can sell one. This entry MUST be withheld from any declared commercial usage, citing CPML as the restricting term. Its cloning quality is not a reason to relax that."
      - "Memory: '~3-4 GB VRAM at fp16 per worker; 6+ GB recommended; 8 GB for stable faster-than-real-time'. Recorded at the 6 GB RECOMMENDED figure rather than the 3-4 GB floor. Processor inference is reported to use 2-3x the accelerator memory figure and is not the intended path."
      - "Storage: '1.88 GB weights at fp32' — one of only three on-disk figures the research sourced in this family."
      - "Licence re-verified in the research pass: CPML, commercial use NOT safe."
      - "PENDING-ACQUISITION: no weight digest and no weight-file size recorded."
    annotations:
      summary: >-
        Coqui XTTS v2 — the best cloning quality among consumer-tier models per
        multiple sources, cloning from a ~6-second sample across 17 languages
        with cross-language transfer and ~200 ms time to first chunk.
        COMMERCIALLY UNUSABLE in practice; a research and self-hosting option
        only.
      voice_cloning: true
      cloning_sample_seconds: 6
      languages: 17
      latency_note: "~200 ms time to first chunk; full streaming support."
      memory_basis: sourced
      memory_sourced: "~3-4 GB VRAM at fp16 per worker; 6+ GB recommended; 8 GB for stable faster-than-real-time"
      storage_basis: sourced
      storage_sourced: "1.88 GB weights at fp32"
      accelerator_note: >-
        Accelerator-oriented. Processor inference exists but uses 2-3x the RAM
        of the accelerator figure and is not the supported path.
      streaming_note: "Speech families are absent from the streaming runtime's roster."
      integrity_status: pending-acquisition
      catalogue_status: verified
  # Promoted from the deferred block 2026-09-02. It was deferred solely for want
  # of an on-disk weight size; that figure has since been measured.
  #
  # PROVENANCE, stated fully because this figure is SINGLE-SOURCED: the two
  # weight files were measured by HTTP HEAD against the ONNX mirror on
  # 2026-09-02 — graph 325,532,387 B + voices 28,214,398 B = 353,746,785 B.
  # Re-verification from the build host was INCONCLUSIVE (its network returns a
  # 15-byte error page instead of headers), so this is one measurement, not two
  # agreeing ones. Recorded rather than estimated, with the method named so it
  # can be re-run where the network permits.
  #
  # WHY THIS ENTRY MATTERS: before it, the only loading text-to-speech entry was
  # xtts-v2 under CPML — non-commercial, and unlicensable since Coqui shut down.
  # A commercial caller asking for speech synthesis received NOTHING from this
  # catalogue: a correct refusal, but an empty family where a commercially-safe,
  # processor-viable option genuinely exists.
  - model_id: kokoro-82m
    family: text-to-speech
    architecture: dense
    descriptor:
      parameter_count: 82000000
      quantisation: fp32
      specialisations: [speech-synthesis]
    memory_required_bytes: 2147483648
    storage_required_bytes: 353746785
    requires_accelerator: false
    source: https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX
    usage_terms:
      license_id: Apache-2.0
      permitted: [commercial, personal, research, evaluation]
    runtime: in-memory
    expected_capability:
      modalities: [audio]
    integrity:
      algorithm: sha256
    notes:
      - "storage measured by HTTP HEAD 2026-09-02: graph 325532387 + voices 28214398 = 353746785 bytes"
      - "single-sourced: re-verification from the build host was inconclusive (restricted network)"
      - "memory figure sourced as '<2 GB VRAM; processor-viable'"
      - "processor-viable at usable speed: ~5x real-time on a 32-core CPU"
      - "54 baked-in voices; NO voice cloning of any kind"
      - "licence Apache-2.0 confirmed via the HF model API 2026-09-02 (gated=false, private=false)"
    annotations:
      storage_basis: measured
      commercial_safe: true
      weight_files: "onnx/kokoro-v1.0.onnx + onnx/voices-v1.0.bin"



