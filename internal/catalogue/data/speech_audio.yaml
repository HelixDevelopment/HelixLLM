# `integrity_expectation` -> `integrity`, `description` -> `annotations.summary`,
# source phrasings and UNVERIFIED markers -> `notes` / `annotations`, and drop
# `streaming_eligible` — listedness is resolved by the loader against the
# roster, never asserted by the entry).
