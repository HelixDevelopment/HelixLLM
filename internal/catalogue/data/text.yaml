# Text-generation model catalogue.
#
# EVERY figure in this file comes from one of two passes, and each entry says
# which:
#   specs/002-adaptive-local-model-serving/research/01-text-llm.md
#   (RESEARCH pass dated 2026-09-02; each figure cited there, sources listed in
#   that file's "Sources" section) — every entry except one.
#   specs/002-adaptive-local-model-serving/research/06-agent-lane-footprint-measurements.md
#   (MEASUREMENT pass dated 2026-09-03; figures produced by running the weights
#   on a host and reading numbers off the running process) — mistral-nemo-12b.
# Wire shape: internal/catalogue/load.go (strict — KnownFields(true); an
#   unrecorded key refuses the WHOLE file, so `annotations` is the only place
#   free-form material may go and `notes` is the only place provenance goes).
# Field semantics: specs/002-adaptive-local-model-serving/data-model.md
#   § "Model Option".
#
# ---------------------------------------------------------------------------
# FOUR INVARIANTS THIS FILE ENCODES — each one is a defect already found and
# must not be reintroduced by a later edit.
# ---------------------------------------------------------------------------
#
#  1. STREAMING ELIGIBILITY IS ROSTER MEMBERSHIP, never an architecture
#     predicate (D1). The disk-streaming runtime (Colibri) supports a CLOSED,
#     NAMED list of 8 model families — the `streaming_roster` list below.
#     An entry states the family name it would be served under in
#     `streaming_family`, and the LOADER resolves that name against the roster;
#     the entry does not get to assert its own listedness. That is the point:
#     data asserting its own membership can drift from the roster, and the
#     roster is the thing the runtime actually has.
#     Several well-known mixture-of-experts models are on NO support path at
#     all (deepseek-v3.2, llama-4-scout, llama-4-maverick, gpt-oss-120b,
#     qwen3-30b-a3b, qwen3-235b-a22b, glm-4.6, gemma-4-26b-a4b): every one of
#     them carries `architecture: mixture-of-experts` and a `streaming_family`
#     that the roster does NOT name, so each resolves to not-eligible.
#     Any code that infers eligibility from `architecture` will offer options
#     that cannot run.
#
#  2. `storage_required_bytes` is a GENUINELY INDEPENDENT axis and is NEVER
#     derived from `memory_required_bytes` (D2). The proof case in this file is
#     glm-5.2: 16 GiB of memory and ~372 GiB of disk — over twenty times the
#     memory figure, and in no way implied by it. Any code that checks only
#     memory headroom will offer that model to a host that cannot store it.
#
#  3. ON A `runtime: streaming` ROW, `memory_required_bytes` IS THE STREAMING
#     RUNTIME'S OWN STATED MINIMUM RAM — NOT AN IN-MEMORY FOOTPRINT. Research
#     §1.8 records a per-family "Min RAM (Colibri)" for every roster member and
#     that is the figure carried here (glm-5.2 "16 GB min"; qwen3.6 "24 GB RAM
#     minimum"; olmoe "8 GB RAM"). Two consequences, each a defect already
#     found (CRITICAL-2) and not to be reintroduced:
#       (a) it is a FLOOR, so it is never scaled DOWN to derive an admission
#           bound. Selection once multiplied it by a 0.25 "resident fraction",
#           admitting a 4 GiB host for glm-5.2 and a 6 GiB host for qwen3.6 —
#           offering a path the runtime itself will not start (FR-027).
#       (b) it must NOT be compared against free memory to ask "does this model
#           fit in memory?". It never answered that question. The artifact a
#           streaming row names is a Colibri-specific pre-converted container
#           (research §3, FR-012) that the in-memory engine cannot open, and an
#           MoE model held in memory needs "the full weight set resident in RAM"
#           — for glm-5.2 that is the ~372 GiB storage figure, not 16 GiB. A row
#           whose artifact has BOTH shapes carries them as SEPARATE entries with
#           their own source and integrity values; qwen3.6 below is the pattern
#           (GGUF row `runtime: in-memory`, Colibri row deferred).
#
#  4. UNVERIFIED FIGURES ARE NEVER RESOLVED INTO A CONFIDENT NUMBER. An
#     invented figure here becomes a wrong selection decision later.
#     This wire format has no way to say "absent": `memory_required_bytes` and
#     `storage_required_bytes` are unsigned integers and zero is refused by
#     Entry.Validate, so a model whose required figure the research did not
#     source CANNOT BE AN ENTRY. Such models are NOT deleted — they are moved
#     verbatim, with every figure, comment and UNVERIFIED marker intact, to the
#     DEFERRED block at the end of this file, each with the measurement it
#     needs. 23 of this file's 30 researched models are deferred that way.
#     It was 24 until mistral-nemo-12b was promoted to a live entry on a
#     MEASUREMENT rather than a published figure (record 18 below): the way
#     out of this block is to measure the thing, which is now demonstrated.
#     Nothing from the research is lost, and nothing is asserted that was not
#     sourced.
#
# ---------------------------------------------------------------------------
# WHY SO MANY ARE DEFERRED — the four blocking conditions, stated plainly
# ---------------------------------------------------------------------------
# Entry.Validate refuses an entry that has any of: no memory figure, no storage
# figure, no licence id, or no permitted purpose. The research pass sourced
# per-quant weight-file sizes for only part of the roster, and recorded no
# licence at all for two families. So:
#   * 16 models have a memory figure but NO sourced on-disk weight size. The
#     research's own estimates ("scaling from the 14B point implies ~20 GB")
#     are its extrapolations, and committing one would be inventing an
#     admission figure. Deriving disk from the memory figure would break
#     invariant 2 outright.
#   *  7 models have neither figure.
#   *  2 models (llama-3.2-1b, llama-3.2-3b) have both figures and NO licence:
#     the research established the Llama 4 licence in detail and recorded
#     nothing about Llama 3.2's own terms.
#   *  1 model (olmoe-7b-a1b) has both figures, is ON the streaming roster, and
#     has NO licence recorded — the runtime's supported-family table gave RAM
#     and disk but no licence.
#   *  4 Gemma models carry a licence id with an EMPTY permitted set: the
#     research established the terms are source-available and not OSI-approved
#     but did not enumerate which purposes they grant, so no purpose is claimed.
# (Some models are blocked by more than one condition; each deferred record
# below names its own.)
#
# ---------------------------------------------------------------------------
# INTEGRITY: EXACTLY ONE ENTRY CARRIES A DIGEST
# ---------------------------------------------------------------------------
# The research gathered no weight-file digest for any model, and fabricating
# one would defeat the check it exists to perform (SC-011). Each researched
# entry therefore names the algorithm and carries `size_bytes` only where a
# real file size was sourced. Entries in that state LOAD and may be OFFERED;
# they are refused by Entry.ValidateForAcquisition, which is the gate that
# precedes touching a weight file. The `digest_key` each entry carried before
# is retained under `annotations.digest_key` — a fetch-time lookup key, not a
# digest.
#
# THE ONE EXCEPTION is mistral-nemo-12b, and it is an exception for the only
# reason that can ever justify one: somebody downloaded the file and ran
# sha256 over the bytes, then checked the result against the publisher's own
# LFS oid. It is consequently the only entry here that
# Entry.ValidateForAcquisition does NOT refuse. A digest arrives by
# measurement or it does not arrive.
#
# ---------------------------------------------------------------------------
# THROUGHPUT
# ---------------------------------------------------------------------------
# No entry states `throughput_tokens_per_second`. The research pass benchmarked
# nothing; it reasoned about relative processor throughput for MoE models but
# produced no measured tokens/second figure for any model here. An absent field
# is the honest record; a zero would read as a measurement of zero.
# mistral-nemo-12b WAS benchmarked (1.64 and 0.87 tok/s at two contexts) and
# still does not state the field: those numbers are CPU-only, 4 threads, on a
# host whose swap was exhausted — a property of that measurement rig, not a
# capability of the model. They are carried in `annotations` with their
# conditions attached, which is where a non-generalising number belongs.
#
# ---------------------------------------------------------------------------
# UNITS
# ---------------------------------------------------------------------------
# Byte values are the research's figure read as BINARY units (MiB = 2^20,
# GiB = 2^30). Each figure's verbatim source phrasing is preserved in
# `annotations.memory_sourced` / `annotations.storage_sourced`, so a
# re-verification pass can correct a reading without re-deriving the source
# number.
#
# `annotations` is free-form and, per load.go, "never read for a decision" — it
# carries provenance only. Nothing in it, and nothing in `notes`, is user-facing
# text: per CONST-046 what a user sees is composed at the presentation boundary
# from `descriptor` facts plus host measurement, in the user's language.
#
# ---------------------------------------------------------------------------
# The disk-streaming runtime's closed, named supported set (research §1.8).
#
# This is DATA. A runtime release that adds a family is an edit to this list,
# never a code change. Rosters from every data file are unioned before any
# entry is resolved, so which file declares a family cannot change the answer.
#
# Recorded here because every member of the roster is a text-family model; it
# is nonetheless the runtime-wide list, not a text-only one.
#
# Runtime: colibri — https://github.com/JustVugg/colibri — closed list.
# The per-family figures the research recorded for each roster member, which
# the previous shape of this file carried inline (the loader's roster is a list
# of NAMES and takes no per-family record):
#
#   glm-5.2             744B total / 40B active
#                       min RAM 17179869184 B  "16 GB min, 24 GB comfortable RAM"
#                       disk    399431958528 B "~372 GB disk storage"
#                       HAS a catalogue entry below.
#   glm-5.3-flash       321B total; active parameters UNVERIFIED (not stated in
#                       the fetched excerpt); min RAM UNVERIFIED; disk UNVERIFIED.
#                       No catalogue entry.
#   inkling             975B total / 41B active; min RAM UNVERIFIED; disk UNVERIFIED.
#                       No catalogue entry.
#   kimi-k3             2.8T total / 104B active; min RAM UNVERIFIED; disk UNVERIFIED.
#                       No catalogue entry.
#   deepseek-v4-flash   284B total / 13B active; min RAM UNVERIFIED; disk UNVERIFIED.
#                       No catalogue entry.
#   qwen3.8-flash-next  125B total ("125B + 51B n-gram"); active UNVERIFIED;
#                       min RAM UNVERIFIED; disk UNVERIFIED. No catalogue entry.
#   qwen3.6             35B total / 3B active; min RAM 25769803776 B
#                       "24 GB RAM minimum"; disk UNVERIFIED.
#                       HAS a catalogue entry below.
#   olmoe               7B total / 1B active; min RAM 8589934592 B "8 GB RAM";
#                       disk 7516192768 B "~7 GB".
#                       Its entry is DEFERRED below for a missing licence.
#
# The five families with no catalogue entry are ON the roster but have NO entry
# below: the research recorded no RAM or disk figure for them, and inventing one
# would violate invariant 4. They are rostered, not offerable — recorded here so
# the gap is visible rather than silent.
# ---------------------------------------------------------------------------

streaming_roster:
  - glm-5.2
  - glm-5.3-flash
  - inkling
  - kimi-k3
  - deepseek-v4-flash
  - qwen3.8-flash-next
  - qwen3.6
  - olmoe

