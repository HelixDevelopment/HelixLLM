      memory_basis: research-cited-band-upper-bound
      memory_sourced: "QA README no-pause table: 'cited peak ~6-10 GB, needs 32 GB+ SYSTEM RAM'"
      storage_basis: composed-estimate
      storage_sourced: "13B at Q4_K ~7.2 GiB + measured text_encoder 17.74 GiB + measured vae 1.56 GiB"
