      storage_basis: composed-estimate
      storage_sourced: "27B at Q4_K ~14.8 GiB + UMT5-XXL encoder 10.58 GiB (measured in sibling repo) + VAE ~0.5 GiB"
      served_config_source: "services/videogen/videogen_server.py env defaults; 480p is the no-pause path for this variant per the QA README table"
      max_supported_resolution: 1280x704
      frame_count_rule: 4n+1
      accelerator_requirement:
        reason_key: video_generation_requires_cuda_accelerator
        lacks: [cuda_accelerator_absent, vram_below_requirement]
        withheld_reason: insufficient_resources
        minimum_free_vram_bytes: 8589934592
        headroom_bytes: 2147483648
        evidence: services/videogen/videogen_server.py
