    # build is established — see the WHAT WOULD ESTABLISH SUPPORT note below.
    usage_terms:
      license_id: LTX-Video-Open-Weights-License-0.X
      permitted: [personal, research, evaluation]
      restrictions:
        - term: revenue-cap
          excludes: [commercial]
          threshold:
            value: 10000000
            currency: USD
            period: annual
          reference: LTX-Video-Open-Weights-License-0.X §2
        - term: attribution-required
          reference: LTX-Video-Open-Weights-License-0.X §3.1
    runtime: in-memory
    expected_capability:
      modalities: [text]
      resolution: 832x480
      num_frames: 49
      fps: 16
      duration_seconds: 3.06
    integrity:
      algorithm: sha256
    notes:
      - "LICENCE: HF API cardData.license == 'other' (2026-09-02); the repo ships LTX-Video-Open-Weights-License-0.X.txt. NOT an open-source licence and NOT interchangeable with the Apache-2.0 WAN entries — this is the restrictive-terms case the family carries."
      - "`commercial` is deliberately ABSENT from `permitted`: under this licence an entity at or above the revenue threshold needs a separate paid Commercial Use Agreement from Lightricks, so commercial use is not granted by these terms alone. A below-threshold entity may still qualify — that is a declared-usage + threshold decision at the selection boundary, which is what `threshold` is carried for; it must not be collapsed into a flat permitted/forbidden (FR-054/FR-055, D4)."
      - "The `attribution-required` restriction is NON-EXCLUSIONARY and states no `excludes`: §3.1 requires the use-based restrictions of §4 to be passed through in any downstream agreement. It constrains how output is used; it never withholds this entry and must not be reported as the reason one was withheld."
      - "Memory SOURCE: QA README no-pause table, 'LTX-Video 13B — GGUF-Q4 (short clip), cited peak ~6-10 GB, needs 32 GB+ SYSTEM RAM'. Upper bound taken."
      - "UNVERIFIED: the memory figure was never measured on this card."
      - "GAP WITH CONSEQUENCE: this entry additionally requires >= 32 GiB SYSTEM RAM (34359738368 B). That is a genuine second admission axis and no schema field carries it, so it is recorded here rather than silently lost. A host with the VRAM but not the system RAM will thrash."
      - "UNVERIFIED: the storage figure is an ESTIMATE. Two MEASURED facts bound it (HF blob API, 2026-09-02), one of which contradicts the manifest: (1) Lightricks/LTX-Video contains NO .gguf file at all — the GGUF-Q4 asset the manifest names must come from an external, env-injected source, so its size is unmeasurable from here. RECONCILED 2026-09-02: the manifest previously read as though the quant lived in this repo and now records that it does not, naming the external Q4_K assets and their measured sizes. (2) LTXPipeline.from_pretrained('Lightricks/LTX-Video') — what the shim actually calls on the ltx backend — resolves the DIFFUSERS-format subtree, not the root 13B single-file checkpoints: text_encoder 17.74 GiB + transformer 7.17 GiB + vae 1.56 GiB ~= 26.5 GiB. That transformer is the smaller diffusers-format model, NOT the 13B; the root-level 13B checkpoints (ltxv-13b-0.9.8-dev.safetensors 26.62 GiB, -fp8 14.62 GiB) are single files the default path does not select. So the shipped ltx backend as configured does not serve 13B without an explicit VIDEOGEN_MODEL override."
      - "Storage estimate = 13B at Q4_K (~7.2 GiB) + the MEASURED T5 text_encoder (17.74 GiB, downloaded in full) + MEASURED vae (1.56 GiB)."
      - "The ~7.2 GiB Q4_K term is now known to be slightly LOW. MEASURED 2026-09-02: the published 13B Q4_K assets are 7_983_375_360 B (7.44 GiB, Q4_K_S) and 8_818_041_856 B (8.21 GiB, Q4_K_M). Neither is substituted for the estimate here, because WHICH variant would be served is undetermined while no source is recorded, and picking one would be a guess (§11.4.6). Re-derive this figure in the same change that records the source."
      - "WHAT WOULD ESTABLISH SUPPORT (so this entry is not merely blocked, but blocked with a way out). MEASURED 2026-09-02: published 13B GGUF-Q4 assets DO exist (wsbagnsv1/ltxv-13b-0.9.7-dev-GGUF; QuantStack/LTXV-13B-0.9.8-dev-GGUF; QuantStack/LTXV-13B-0.9.8-distilled-GGUF). NONE of the three carries model_index.json, so `from_pretrained` — the only call shape the service implements — cannot load any of them; that is why a source is still not recorded. Route 1: implement a GGUF load path (transformer via `from_single_file` + `GGUFQuantizationConfig`, encoder/VAE/tokenizer/scheduler sourced separately), then record one of those repos as `source` with its MEASURED asset size. Route 2: re-record this entry against a diffusers-format 13B repo that `from_pretrained` does resolve to a 48-layer transformer — but note its transformer alone MEASURES 24.29 GiB, which is a coder-pause size, so this would cease to be a no-pause entry and its memory figure must be re-measured, not carried over."
      - "UNVERIFIED: no `integrity.size_bytes` is stated — the env-injected GGUF asset is not present in the HF repo."
      - "The HF card states native 1216x704 at 30 fps, best under 720x1280 and below 257 frames (~8.5 s at 30 fps), with frame counts divisible by 8 plus 1. `expected_capability` states the served short-clip 480p configuration, which is the only shape the no-pause budget admits."
      - "PENDING-ACQUISITION: no weight digest recorded."
