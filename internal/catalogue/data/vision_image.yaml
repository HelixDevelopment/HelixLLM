# Vision (image-understanding) and image-generation catalogue entries.
#
# SOURCE OF TRUTH for every figure, licence and viability claim below:
#   specs/002-adaptive-local-model-serving/research/02-vision-image.md
#   (research pass dated 2026-09-02; its "Sources" section carries the per-claim
#   citations and a §11.4.99 90-day staleness bound.)
# Field semantics: specs/002-adaptive-local-model-serving/data-model.md
#   § "Model Option". Wire shape: internal/catalogue/load.go (strict —
#   KnownFields(true); an unrecorded key refuses the whole file).
#
# ---------------------------------------------------------------------------
# 1. LICENCE IS A SELECTION CONSTRAINT, NOT METADATA (FR-054/FR-055, D4)
# ---------------------------------------------------------------------------
# Two sibling PAIRS below differ in nothing that matters to selection except
# their licence — same vendor, same architecture, same footprint, same serving
# path:
#     flux.1-schnell   Apache-2.0  <->  flux.1-dev       non-commercial
#     flux.2-klein-4b  Apache-2.0  <->  flux.2-klein-9b  non-commercial
# (flux.2-klein-9b is deferred below for an unrelated reason; its licence is
# recorded there.) Where a licence does not grant commercial use, `commercial`
# is ABSENT from `usage_terms.permitted` AND a restriction `excludes` it. Both
# halves are needed: Entry.Validate rejects permitting a purpose your own
# restriction excludes, while UsageTerms.RestrictionFor(commercial) is what lets
# a caller NAME the term that withheld the model instead of reporting a generic
# unavailability. Offering a legally-unusable model is the failure this
# prevents.
#
# RESTRICTION TERMS ARE A CLOSED SET in load.go (parseRestrictionTerm):
# non-commercial, revenue-cap, attribution-required, share-alike, research-only.
# Two licence shapes in this research have no matching term, and are recorded
# honestly rather than forced into a wrong one:
#   - MiniCPM-V-4.5: free for research/academic use, commercial use requires
#     registration with the vendor. Encoded as `research-only` excluding
#     commercial — which is what the licence grants — with the registration
#     requirement spelled out in `reference` and `notes`. A `registration-
#     required` term would be more exact and may warrant a Go constant.
#   - RAIL and Gemma use-based restrictions (SD 1.5, PixArt-Sigma, SDXL,
#     PaliGemma2): these EXCLUDE NO PURPOSE. They constrain how output may be
#     used and can never withhold an entry, so encoding them as an exclusionary
#     term would be false. They are recorded in `notes` and `annotations`
#     instead, and commercial use stays granted.
#
# ---------------------------------------------------------------------------
# 2. NO IMAGE-GENERATION MODEL IS PROCESSOR-VIABLE AT INTERACTIVE SPEED
# ---------------------------------------------------------------------------
# `requires_accelerator: true` on ALL 11 image-generation entries. Research §3b
# states it plainly: no candidate is confirmed to produce output in anything
# resembling interactive time on a processor alone. The one model with a sourced
# processor figure — Stable Diffusion 1.5 through stable-diffusion.cpp — needs
# 5 to 20 MINUTES for one 512x512 image, and that engine is not wired in this
# repository. A host with no accelerator therefore receives a stated reason
# (`annotations.accelerator_requirement_reason` on each entry) INSTEAD of an
# offer. That is FR-028 working as intended, not a gap to paper over.
#
# ---------------------------------------------------------------------------
# 3. VISION IS THE OPPOSITE CASE — no-GPU hosts still get REAL options (FR-003)
# ---------------------------------------------------------------------------
# Five vision entries carry `requires_accelerator: false` on sourced grounds:
# smolvlm2-256m, smolvlm2-500m, moondream2 (int4), qwen2.5-vl-3b-instruct (the
# one MEASURED entry in this file) and qwen3-vl-4b-instruct. The 8B tier and
# above carry true: the research rates 8B-class processor latency as fitting in
# system memory but NOT usable (SC-001), and above roughly 8B it is compute, not
# memory, that binds — so a larger memory figure does not rescue it.
#
# ---------------------------------------------------------------------------
# 4. UNVERIFIED FIGURES ARE NEVER RESOLVED INTO A CONFIDENT NUMBER (§11.4.6)
# ---------------------------------------------------------------------------
# `memory_required_bytes` drives admission. Where the research marks a model's
# memory figure UNVERIFIED, estimated or extrapolated, there is NO honest number
# to put here — and this wire format has no way to say "absent" (the field is an
# unsigned integer, and zero is refused by Entry.Validate). Inventing a figure
# would silently drive a wrong selection, so those models are NOT entries. They
# are recorded in full in the DEFERRED block at the end of this file, with the
# measurement each one needs. Ten models are deferred that way; nothing from the
# research is lost, and nothing is asserted that was not measured.
#
# Every surviving entry's per-figure basis is in `annotations.memory_basis` and
# `annotations.storage_basis`, and every UNVERIFIED marker from the research is
# carried verbatim in `notes`.
#
# ---------------------------------------------------------------------------
# STORAGE IS AN INDEPENDENT AXIS (D2)
# ---------------------------------------------------------------------------
# `storage_required_bytes` is NEVER derived from `memory_required_bytes`. Where
# the research stated no on-disk figure, storage is derived from parameter count
# x bytes-per-weight — arithmetic on the model, not a copy of the memory axis —
# and `annotations.storage_basis` says `derived-from-parameters` with a matching
# `notes` marker. The clearest proof case here is qwen2.5-vl-3b-instruct:
# 4138 MiB of MEASURED memory against 2639 MiB of disk. Neither implies the
# other.
#
# ---------------------------------------------------------------------------
# INTEGRITY: NO DIGEST EXISTS ANYWHERE IN THIS FILE
# ---------------------------------------------------------------------------
# Research 02 gathered no weight-file digest for any model, and fabricating one
# would defeat the check it exists to perform (SC-011). Each entry names the
# algorithm and carries `size_bytes` only where a real file size was sourced.
#
# CONSEQUENCE, STATED PLAINLY: every entry here LOADS and may be OFFERED, and
# every one is refused by Entry.ValidateForAcquisition with
# ErrIncompleteIntegrity — the gate that precedes touching a weight file.
# (CORRECTED 2026-09-02: this paragraph previously said Entry.Validate reports
# ErrIncompleteIntegrity and that catalogue.Load therefore refuses this file.
# That is no longer true and the file loads today. Validate deliberately does
# NOT require an integrity expectation — as entry.go now explains, demanding it
# there made the catalogue unloadable in its ordinary initial state: nothing
# could load, so no download could be triggered, so no digest could ever be
# captured.) The sibling data files text.yaml, video.yaml and speech_audio.yaml
# are in the same digest-less state. This is a shared, visible, closeable gap —
# not a defect peculiar to this file, and not something to close by inventing
# hex.
#
# ---------------------------------------------------------------------------
# UNITS
# ---------------------------------------------------------------------------
# Byte values are a mechanical conversion of the research's own figure, read in
# the unit the research used: GiB/MiB as 2^30/2^20 where it wrote GiB/MiB, GB as
# 10^9 where it wrote GB (as HuggingFace reports file sizes). Each figure's
# verbatim source phrasing is in `annotations.*_sourced`, so a re-verification
# pass can correct a reading without re-deriving the source number. Do not read
# more significant figures into a byte integer than its sourced value carries.
#
# `annotations` is free-form and, per load.go, "never read for a decision" — it
# carries provenance only. Nothing in it, and nothing in `notes`, is user-facing
# text: per CONST-046 and entry.go's own doc comment, what a user sees is
# composed at the presentation boundary from `descriptor` facts plus host
# measurement, in the user's language.

entries:

  # =========================================================================
  # FAMILY: vision — image in, text out
  # =========================================================================

