# ===========================================================================
# DEFERRED — researched, NOT offered, and deliberately NOT entries above
# ===========================================================================
#
# Each model below appears in research 02 but has NO honest memory figure: the
# research marks it UNVERIFIED, estimated or extrapolated. `memory_required_
# bytes` drives admission, this wire format cannot express "absent" (the field
# is an unsigned integer and zero is refused by Entry.Validate), and inventing a
# number would silently drive a wrong selection — the exact failure FR-056 and
# §11.4.6 forbid. They are recorded here in full, with the measurement each one
# needs, so nothing from the research is lost and the gap stays closeable.
#
# VISION — 9 deferred
#
#   internvl3-8b (8 B; InternViT-300M-448px-V2.5 tower + Qwen2.5-7B LM)
#     Licence: project licence MIT — BUT it composes a Qwen2.5 component whose
#       own sub-licence must be read before shipping; Qwen licensing has varied
#       by size and series. Do not treat the MIT grant as settled.
#     Memory: UNVERIFIED at GGUF Q4 (research estimate ~6-8 GB). The vendor's
#       own BF16 reference numbers assume 80 GB-class GPUs and do NOT apply to
#       the quantised local-serving path.
#     Storage: UNVERIFIED — "treat as comparable to other 8B VLMs (~5 GB at
#       Q4_K_M) pending a direct measurement". Five quantised variants exist via
#       community requantisers but no size table was found.
#     Processor: UNVERIFIED, no benchmark found. Accelerator would be required
#       on the same 8B-class latency finding as qwen3-vl-8b-instruct.
#     Source: https://huggingface.co/OpenGVLab/InternVL3-8B
#     NEEDS: a measured Q4 GGUF size and accelerator-memory peak.
#
#   phi-4-multimodal-instruct (5.6 B; vision + speech adapters over Phi-4-Mini)
#     Licence: MIT. Commercial use permitted.
#     Memory: UNVERIFIED — no GGUF or llama.cpp quantisation sizes located at
#       all; research says treat as an 8 GB+ candidate pending quantisation data.
#     Storage: ~12.9 GB repository footprint (mixed vision + speech + text
#       adapters) — a whole-repo figure, not a single weight file.
#     Processor: UNVERIFIED. Architecture suggests viability similar to other
#       5-8B models but no confirming source was found.
#     Serving: UNVERIFIED — llama.cpp libmtmd support for Phi-4-multimodal
#       specifically is NOT confirmed and MUST be re-checked against
#       docs/multimodal.md in the pinned llama.cpp release.
#     Source: https://huggingface.co/microsoft/Phi-4-multimodal-instruct
#     NEEDS: a quantisation ladder, and confirmation of libmtmd support.
#
#   paligemma2-3b (pt-224 / 448 / 896; Gemma-2 2B LM + SigLIP tower)
