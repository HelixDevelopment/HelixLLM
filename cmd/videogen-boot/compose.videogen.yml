# Phase-4 GPU video-gen — WAN 2.2 / LTX-Video, served on its OWN port (:18443,
# config-injected). Booted THROUGH the containers submodule compose.Orchestrator
# (§11.4.76), rootless podman (§11.4.161) with GPU access via the NVIDIA CDI
# spec. Distinct from the coder (:18434) and the image-gen sibling (:18442) —
# §11.4.119 single-resource-owner.
#
# NO hardcoded model / precision / host-port literal (§CONST-045 / §CONST-046):
# every value is injected from the environment by run_proof.sh; the ${VAR}
# forms are always set by the harness before boot. The GPU reservation is
# admitted by the vrambroker (ClassVideo) BEFORE this file is `up`'d
# (cmd/videogen-boot).
services:
  videogen:
    build:
      context: ../../services/videogen
      dockerfile: Containerfile
    image: helixllm-videogen:wan-fp8
    environment:
      VIDEOGEN_BACKEND: "${VIDEOGEN_BACKEND}"          # wan | ltx
      VIDEOGEN_MODEL: "${VIDEOGEN_MODEL}"
      VIDEOGEN_PRECISION: "${VIDEOGEN_PRECISION}"      # Blackwell no-pause: fp8 / gguf-q4
      VIDEOGEN_CPU_OFFLOAD: "${VIDEOGEN_CPU_OFFLOAD}"
      VIDEOGEN_MAX_STEPS: "${VIDEOGEN_MAX_STEPS}"
      VIDEOGEN_NUM_FRAMES: "${VIDEOGEN_NUM_FRAMES}"
      VIDEOGEN_FPS: "${VIDEOGEN_FPS}"
      VIDEOGEN_SIZE: "${VIDEOGEN_SIZE}"
      HF_HOME: /models/hf
      HF_TOKEN: "${HF_TOKEN}"                          # §11.4.10 — from .env, never committed/logged
    ports:
      - "${VIDEOGEN_HOST_PORT}:8080"
    volumes:
      - helixllm-videogen-cache:/models/hf
    # Rootless-podman GPU access via CDI (§11.4.161). The NVIDIA container
    # toolkit must have generated the CDI spec (nvidia.com/gpu=all).
    devices:
      - "nvidia.com/gpu=all"
    # §12.3 container hygiene + §12.6 host-safety — bounded so a first-run OOM
    # cannot starve the developer host. Config-injected, captured as evidence.
    mem_limit: "${VIDEOGEN_MEM_LIMIT}"
    shm_size: "${VIDEOGEN_SHM_SIZE}"
    restart: "no"
volumes:
  helixllm-videogen-cache:
    external: true
    name: helixllm-videogen-cache
