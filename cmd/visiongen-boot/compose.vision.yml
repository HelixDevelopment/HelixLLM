# VISION (VLM) — Qwen2.5-VL multimodal server (GGUF + mmproj / libmtmd) served on
# its OWN port (:18439, config-injected). Booted THROUGH the containers submodule
# compose.Orchestrator (§11.4.76), rootless podman (§11.4.161) with GPU access via
# the NVIDIA CDI spec. Distinct from the coder (:18434) + every sibling capability
# lane (:18435-18443) — §11.4.119 single-resource-owner.
#
# REUSES the already-built router image — NO `build:` directive, NO rebuild
# (§11.4.74 reuse-don't-reimplement). The router image ships the CUDA
# sm120 llama-server + libmtmd multimodal projector loader; the `command:` below
# runs it as a multimodal server (the phase3 3B proof used the exact same image
# + flags via ad-hoc podman; this compose promotes that into the on-demand-infra
# boot path, §11.4.76).
#
# Model SELECTION is an OUTPUT of measured selection, never a value chosen here.
# VISIONGEN_MODEL_GGUF / VISIONGEN_MMPROJ are written by cmd/visiongen-boot from
# the option its measurement of THIS host actually admitted (applyChoice, main.go),
# and they carry NO DEFAULT — deliberately.
#
# A `${VAR:-some-model.gguf}` default here would defeat the refusal path
# entirely. visiongen-boot refuses when nothing can run (exitNoOptionOffered /
# exitHostNotMeasured, modelchoice.go) and starts nothing; but a default in this
# file means the variable is never actually absent, so running this compose
# directly — bypassing the binary — serves a model no host was ever measured
# against (FR-056). That is the same defect the imagegen lane carried one layer
# below its migrated binary; see services/imagegen/Containerfile and the bare
# `${IMAGEGEN_MODEL}` in cmd/imagegen-boot/compose.imagegen.yml, which is the
# form followed here.
#
# Consequence, stated rather than discovered: this file no longer boots
# "out-of-the-box" on its own. That is the point. Boot it through
# `visiongen-boot boot`, which measures first and then supplies both values.
# Every candidate the catalogue records — the 3B pair the phase3 proof measured
# and the larger 7B alike — remains selectable; which one runs is decided by
# measurement rather than by a literal in this file (§11.4.122: nothing removed,
# the choice moved to where it can be justified).
#
# Model artefacts (GGUF + mmproj) live OUTSIDE the repo (gitignored, §11.4.30) at
# the host dir injected via ${VISIONGEN_MODEL_DIR} (defaults to ~/models/vlm_cache
# — the phase3 harness's cache dir — injected by cmd/visiongen-boot at boot time,
# never hardcoded here; §11.4.77 regeneration = the router-image HTTPS pull). The
# reservation is admitted by the vrambroker BEFORE this file is `up`'d
# (cmd/visiongen-boot, ClassVLM warm tier).
services:
  visiongen:
    image: localhost/helixllm/llamacpp-router:cuda12.8-sm120
    # Multimodal llama-server: the weights + mmproj DECIDED by measured
    # selection (see header note — no default, deliberately), 16K context, all
    # layers on GPU (-ngl 99). Health/OpenAI API on :18439 inside + published.
    #
    # NOTE (§11.4.108 SOURCE->ARTIFACT->RUNTIME finding, captured
    # docs/qa/helixllm_vision_boot_*/router_image_entrypoint.txt): the router
    # image's ENTRYPOINT is already ["llama-server"] (podman inspect
    # .Config.Entrypoint) — the `command:` list below is passed as ARGV to
    # that entrypoint, NOT a fresh shell invocation. A leading "llama-server"
    # token here duplicates the entrypoint binary name as argv[1] and llama-
    # server rejects it ("invalid argument: llama-server"). Do NOT re-add it.
    command:
      - -m
      - /models/${VISIONGEN_MODEL_GGUF}                      # DECIDED — no default
      - --mmproj
      - /models/${VISIONGEN_MMPROJ}                          # DECIDED — no default
      - --host
      - 0.0.0.0
      - --port
      - "18439"
      - -ngl
      - "99"
      - -c
      - "16384"
      - --jinja
    ports:
      - "18439:18439"
    volumes:
      # GGUF + mmproj model cache — host dir injected, never a hardcoded path
      # (§CONST-045 / §11.4.28 decoupling). Read-only into the container.
      - "${VISIONGEN_MODEL_DIR}:/models:ro"
    # Rootless-podman GPU access via CDI (§11.4.161). The NVIDIA container toolkit
    # must have generated the CDI spec (nvidia.com/gpu=all).
    devices:
      - "nvidia.com/gpu=all"
    # §12.3 container hygiene + §12.6 host-safety — bounded so a first-run OOM
    # cannot starve the developer host. The default 3B Q4 + Q8_0 mmproj + 16K KV
    # measured ~4.1 GiB actual (phase3 proof); a 7B override still fits well
    # under this cap on the 32 GB RTX 5090.
    mem_limit: "${VISIONGEN_MEM_LIMIT:-16g}"
    shm_size: "${VISIONGEN_SHM_SIZE:-2g}"
    restart: "no"
